# Builds the opening book in the cloud, so nothing runs on your own computer.
#
# Each month of Lichess games is downloaded ONCE (one job per month) and counted for every time control (bullet, blitz,
# rapid, classical) at the same time, all months in parallel on free GitHub machines. The parts are then merged into one
# book you download. The app lets players choose time controls and rating groups, so the book keeps separate counts.
# Run it from the repository's Actions tab: "Build opening book" -> "Run workflow".
# Several builds can be combined afterwards with "Merge opening book parts".
#
# Be kind to Lichess's servers: every month is a download of up to ~30 GB. The caps below keep each job short for recent
# months. A job may run for at most 6 hours.
name: Build opening book

on:
  workflow_dispatch:
    inputs:
      months:
        description: 'Months to process, comma separated (YYYY-MM)'
        default: '2026-09,2026-08,2026-07,2026-06,2026-05,2026-04'
      cap_bullet:
        description: 'Bullet games to keep per month (0 = skip bullet)'
        default: '6000000'
      cap_blitz:
        description: 'Blitz games to keep per month (0 = skip blitz)'
        default: '8000000'
      cap_rapid:
        description: 'Rapid games to keep per month (0 = skip rapid)'
        default: '6000000'
      cap_classical:
        description: 'Classical games to keep per month (0 = skip). Classical is rare (about 1% of games), so this reads the whole month file'
        default: '3000000'
      part_min_position:
        description: 'Per part: drop positions seen fewer times than this'
        default: '10'
      final_min_position:
        description: 'After merging: drop positions seen fewer times than this (raise it to shrink the book)'
        default: '40'
      chunk_min_position:
        description: 'Depth control: inside each chunk of games, expand a line once seen this often (lower = deeper, slower, more memory)'
        default: '5'
      min_parent:
        description: 'Depth control: inside each chunk, create a child once its parent was seen this often'
        default: '3'
      chunk_min_move:
        description: 'Depth control: inside each chunk, keep a move once seen this often'
        default: '2'
      chunk_games:
        description: 'Games per in-memory chunk (bigger = rare lines add up before pruning, but needs more memory)'
        default: '600000'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      months: ${{ steps.list.outputs.months }}
    steps:
      - id: list
        env:
          MONTHS: ${{ inputs.months }}
        run: |
          python3 - <<'PY'
          import json, os, re
          months = [m.strip() for m in os.environ['MONTHS'].split(',') if m.strip()]
          for m in months:
              assert re.fullmatch(r'\d{4}-\d{2}', m), f'bad month: {m!r}'
          assert len(months) <= 250, 'too many months for one run (GitHub allows 256 jobs per matrix)'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('months=' + json.dumps(months) + '\n')
          PY

  part:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 358
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        month: ${{ fromJson(needs.plan.outputs.months) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install zstandard chess
      - name: Build this month
        env:
          MONTH: ${{ matrix.month }}
          CAP_BULLET: ${{ inputs.cap_bullet }}
          CAP_BLITZ: ${{ inputs.cap_blitz }}
          CAP_RAPID: ${{ inputs.cap_rapid }}
          CAP_CLASSICAL: ${{ inputs.cap_classical }}
          MINPOS: ${{ inputs.part_min_position }}
          CMINPOS: ${{ inputs.chunk_min_position }}
          MINPARENT: ${{ inputs.min_parent }}
          CMINMOVE: ${{ inputs.chunk_min_move }}
          CHUNK: ${{ inputs.chunk_games }}
        run: |
          speeds=(); caps=()
          if [ "$CAP_BULLET" -gt 0 ]; then speeds+=(bullet); caps+=("$CAP_BULLET"); fi
          if [ "$CAP_BLITZ" -gt 0 ]; then speeds+=(blitz); caps+=("$CAP_BLITZ"); fi
          if [ "$CAP_RAPID" -gt 0 ]; then speeds+=(rapid); caps+=("$CAP_RAPID"); fi
          if [ "$CAP_CLASSICAL" -gt 0 ]; then speeds+=(classical); caps+=("$CAP_CLASSICAL"); fi
          [ "${#speeds[@]}" -gt 0 ] || { echo "every time control is set to 0"; exit 1; }
          SPEEDS=$(IFS=,; echo "${speeds[*]}"); CAPS=$(IFS=,; echo "${caps[*]}")
          /usr/bin/time -v python tools/build_book.py \
            --url "https://database.lichess.org/standard/lichess_db_standard_rated_${MONTH}.pgn.zst" \
            --speeds "$SPEEDS" --caps "$CAPS" --max-minutes 335 \
            --chunk "${CHUNK}" --shards 1024 --min-position "${MINPOS}" --min-move 3 \
            --chunk-min-position "${CMINPOS}" --min-parent "${MINPARENT}" --chunk-min-move "${CMINMOVE}" \
            --out part 2> time.log || { tail -n 30 time.log; exit 1; }
          grep -E "Maximum resident|Elapsed" time.log
          du -sh part
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.month }}
          path: part
          retention-days: 7   # kept a week so the merge can be re-run with different pruning

  merge:
    needs: part
    if: ${{ !cancelled() }}   # merge whatever parts finished, even if a few timed out
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts
      - name: Merge the parts
        env:
          MINPOS: ${{ inputs.final_min_position }}
        run: |
          dirs=$(find parts -name meta.json -printf '%h\n' | sort)
          echo "parts: $(echo "$dirs" | wc -l)"
          python tools/merge_books.py book $dirs --min-position "${MINPOS}" --min-move 5
          cat book/meta.json
          du -sh book
      - uses: actions/upload-artifact@v4
        with:
          name: book
          path: book
          retention-days: 14
