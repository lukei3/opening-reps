# Puts the app on the internet with GitHub Pages (free): builds dist/ and publishes it.
# Run it from the repository's Actions tab ("Deploy site" -> "Run workflow"). Pages needs the repository to be public
# on a free account. The site appears at https://<user>.github.io/<repository>/
name: Deploy site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the shippable folder
        run: python tools/build_dist.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
