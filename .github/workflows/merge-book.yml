# Merges the finished parts of one or more "Build opening book" runs into a single book, without building anything.
# Use it to combine several builds (for example different months), or to rescue a run where a few parts timed out.
# The parts are kept for 7 days after a build, so merge within that time.
#
#   Actions > "Merge opening book parts" > Run workflow, then give the run numbers (the number at the end of a run's URL).
name: Merge opening book parts

on:
  workflow_dispatch:
    inputs:
      run_ids:
        description: 'Build run numbers to merge, comma separated'
        required: true
      final_min_position:
        description: 'Drop positions seen fewer times than this (raise it to shrink the book)'
        default: '40'
      final_min_move:
        description: 'Drop moves seen fewer times than this'
        default: '5'

permissions:
  contents: read
  actions: read

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the parts
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ inputs.run_ids }}
        run: |
          for run in $(echo "$RUNS" | tr ',' ' '); do
            case "$run" in (*[!0-9]*|'') echo "bad run number: $run"; exit 1;; esac
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --pattern 'part-*' --dir "parts/$run"
          done
          ls parts/*/ | head -n 200
          echo "parts: $(ls -d parts/*/part-* | wc -l)"
      - name: Merge
        env:
          MINPOS: ${{ inputs.final_min_position }}
          MINMOVE: ${{ inputs.final_min_move }}
        run: |
          python tools/merge_books.py book parts/*/part-* --min-position "${MINPOS}" --min-move "${MINMOVE}"
          cat book/meta.json
          du -sh book
      - uses: actions/upload-artifact@v4
        with:
          name: book
          path: book
          retention-days: 14
